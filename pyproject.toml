[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stitchgauge"
version = "1.0.0"
description = "Knitting gauge swatch calculator, stitch-to-row ratio adjuster and yarn weight substitution helper (single file, standard library only)."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "StitchGauge" }]
keywords = ["knitting", "gauge", "swatch", "yarn", "cli"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
stitchgauge = "stitchgauge:main"

[tool.setuptools]
py-modules = ["stitchgauge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
